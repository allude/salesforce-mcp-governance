<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="planeRuntime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="planeAdmin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bgGrad)"/>

  <!-- Header -->
  <text x="40" y="45" fill="#f8fafc" font-size="22" font-weight="700">Enterprise Salesforce MCP Server — Zero-Trust Per-User &amp; Profile RBAC Architecture</text>
  <text x="40" y="70" fill="#94a3b8" font-size="14">Streamable HTTP (/mcp) • Microsoft Copilot Studio Delegated OAuth 2.0 • Salesforce Profile Policy Engine • Okta OIDC Admin Portal</text>

  <!-- PLANE 1: RUNTIME EXECUTION PLANE -->
  <rect x="30" y="90" width="1140" height="390" rx="14" fill="url(#planeRuntime)" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="120" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.2">1. RUNTIME EXECUTION PLANE (DELEGATED PER-USER AUTHENTICATION)</text>

  <!-- Participant Columns -->
  <!-- End User -->
  <rect x="55" y="140" width="140" height="54" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="125" y="164" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">End User</text>
  <text x="125" y="182" fill="#94a3b8" font-size="11" text-anchor="middle">Teams / M365 Copilot</text>
  <line x1="125" y1="194" x2="125" y2="460" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Copilot Studio -->
  <rect x="245" y="140" width="175" height="54" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="332" y="164" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">MS Copilot Studio</text>
  <text x="332" y="182" fill="#38bdf8" font-size="11" text-anchor="middle">OAuth 2.0 Token Store</text>
  <line x1="332" y1="194" x2="332" y2="460" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Salesforce OAuth -->
  <rect x="470" y="140" width="165" height="54" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="552" y="164" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Salesforce OAuth</text>
  <text x="552" y="182" fill="#7dd3fc" font-size="11" text-anchor="middle">Connected App</text>
  <line x1="552" y1="194" x2="552" y2="460" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- MCP Server -->
  <rect x="690" y="140" width="220" height="54" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
  <text x="800" y="164" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Salesforce MCP Server</text>
  <text x="800" y="182" fill="#34d399" font-size="11" text-anchor="middle">Streamable HTTP + Profile RBAC</text>
  <line x1="800" y1="194" x2="800" y2="460" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Salesforce REST API -->
  <rect x="965" y="140" width="180" height="54" rx="8" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="1055" y="164" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Salesforce REST API</text>
  <text x="1055" y="182" fill="#7dd3fc" font-size="11" text-anchor="middle">/services/data/v62.0</text>
  <line x1="1055" y1="194" x2="1055" y2="460" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Sequence Arrows (Runtime) -->
  <!-- Step 1 -->
  <line x1="125" y1="225" x2="324" y2="225" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="225" y="218" fill="#e2e8f0" font-size="11" text-anchor="middle">1. "Show my open opportunities"</text>

  <!-- Step 2 -->
  <line x1="332" y1="258" x2="544" y2="258" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="440" y="250" fill="#93c5fd" font-size="11" text-anchor="middle">2. OAuth 2.0 Sign-In (1st time only)</text>

  <!-- Step 3 -->
  <line x1="552" y1="288" x2="340" y2="288" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <text x="442" y="280" fill="#6ee7b7" font-size="11" text-anchor="middle">3. Per-User Access &amp; Refresh Token</text>

  <!-- Step 4 -->
  <line x1="332" y1="325" x2="792" y2="325" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="562" y="317" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">4. POST /mcp (Authorization: Bearer &lt;USER_SF_TOKEN&gt;)</text>

  <!-- Step 5: RBAC Verification Box -->
  <rect x="680" y="340" width="240" height="44" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
  <text x="800" y="358" fill="#ecfdf5" font-size="11" font-weight="600" text-anchor="middle">5. Verify Token &amp; Check User's</text>
  <text x="800" y="374" fill="#6ee7b7" font-size="10.5" text-anchor="middle">Salesforce Profile in RBAC Policy Matrix</text>

  <!-- Step 6 -->
  <line x1="800" y1="405" x2="1047" y2="405" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="928" y="397" fill="#7dd3fc" font-size="11" text-anchor="middle">6. Execute REST Call as User</text>

  <!-- Step 7 -->
  <line x1="1055" y1="435" x2="808" y2="435" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <text x="928" y="427" fill="#6ee7b7" font-size="11" text-anchor="middle">7. Filtered Records (OWD + FLS)</text>

  <!-- Step 8 -->
  <line x1="800" y1="452" x2="133" y2="452" stroke="#34d399" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>
  <text x="460" y="445" fill="#f8fafc" font-size="11" text-anchor="middle">8. Streamable HTTP JSON-RPC Tool Result -&gt; Copilot Response</text>

  <!-- PLANE 2: ADMIN CONTROL PLANE -->
  <rect x="30" y="500" width="1140" height="250" rx="14" fill="url(#planeAdmin)" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="50" y="530" fill="#c4b5fd" font-size="13" font-weight="700" letter-spacing="1.2">2. ADMIN CONTROL PLANE (OKTA OIDC SSO + SALESFORCE PROFILE RBAC MATRIX)</text>

  <!-- Admin Actor -->
  <rect x="55" y="555" width="150" height="75" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="130" y="585" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">MCP Administrator</text>
  <text x="130" y="605" fill="#c4b5fd" font-size="11" text-anchor="middle">Web Browser (HTTPS)</text>

  <!-- Okta SSO -->
  <rect x="280" y="555" width="185" height="75" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="372" y="582" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Okta SSO (OIDC + PKCE)</text>
  <text x="372" y="600" fill="#fcd34d" font-size="11" text-anchor="middle">Admin Identity &amp; MFA</text>
  <text x="372" y="616" fill="#94a3b8" font-size="10" text-anchor="middle">HttpOnly Encrypted Session</text>

  <!-- Admin Web UI & Policy Engine -->
  <rect x="545" y="555" width="320" height="165" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
  <text x="705" y="580" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Admin Web Portal &amp; RBAC Policy Store</text>
  <text x="705" y="598" fill="#a78bfa" font-size="11" text-anchor="middle">Profile-Based Action Governance (SQLite)</text>

  <!-- Matrix Table Preview inside Admin Portal -->
  <rect x="565" y="610" width="280" height="95" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="577" y="628" fill="#94a3b8" font-size="10" font-weight="700">SALESFORCE PROFILE</text>
  <text x="715" y="628" fill="#94a3b8" font-size="10" font-weight="700">QUERY</text>
  <text x="765" y="628" fill="#94a3b8" font-size="10" font-weight="700">WRITE</text>
  <text x="810" y="628" fill="#94a3b8" font-size="10" font-weight="700">DEL</text>

  <text x="577" y="650" fill="#e2e8f0" font-size="10.5">System Administrator</text>
  <text x="725" y="650" fill="#34d399" font-size="11" font-weight="700">ON</text>
  <text x="772" y="650" fill="#34d399" font-size="11" font-weight="700">ON</text>
  <text x="815" y="650" fill="#34d399" font-size="11" font-weight="700">ON</text>

  <text x="577" y="672" fill="#e2e8f0" font-size="10.5">Standard Sales User</text>
  <text x="725" y="672" fill="#34d399" font-size="11" font-weight="700">ON</text>
  <text x="772" y="672" fill="#34d399" font-size="11" font-weight="700">ON</text>
  <text x="813" y="672" fill="#f87171" font-size="11" font-weight="700">OFF</text>

  <text x="577" y="694" fill="#e2e8f0" font-size="10.5">Read-Only Auditor</text>
  <text x="725" y="694" fill="#34d399" font-size="11" font-weight="700">ON</text>
  <text x="770" y="694" fill="#f87171" font-size="11" font-weight="700">OFF</text>
  <text x="813" y="694" fill="#f87171" font-size="11" font-weight="700">OFF</text>

  <!-- Salesforce Org Profile Sync -->
  <rect x="945" y="555" width="195" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1042" y="582" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">Salesforce Org Sync</text>
  <text x="1042" y="602" fill="#7dd3fc" font-size="10.5" text-anchor="middle">SELECT Id, Name, UserType</text>
  <text x="1042" y="618" fill="#7dd3fc" font-size="10.5" text-anchor="middle">FROM Profile</text>
  <text x="1042" y="636" fill="#94a3b8" font-size="10" text-anchor="middle">Pulls all Standard &amp; Custom Profiles</text>

  <!-- Admin Plane Arrows -->
  <line x1="205" y1="585" x2="272" y2="585" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="238" y="575" fill="#fde68a" font-size="10" text-anchor="middle">1. OIDC Login</text>

  <line x1="465" y1="585" x2="537" y2="585" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="501" y="575" fill="#ddd6fe" font-size="10" text-anchor="middle">2. Verified Admin</text>

  <line x1="865" y1="600" x2="937" y2="600" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="901" y="590" fill="#7dd3fc" font-size="10" text-anchor="middle">3. Sync Profiles</text>

  <!-- Policy Enforcement Link from Admin Store up to Runtime MCP Server -->
  <path d="M 760 555 L 760 390" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowPurple)"/>
  <text x="695" y="492" fill="#c4b5fd" font-size="10.5" font-weight="600">Enforces Profile Tool Policies</text>
</svg>
